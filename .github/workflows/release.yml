# Publishes Dp9ik, Dp9ik.P9Auth and Dp9ik.Tls to nuget.org with Trusted Publishing:
# a short-lived API key from GitHub's OIDC token, no stored NuGet secret.
# Release by pushing a tag v<Version>, matching <Version> in src/Directory.Build.props.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the package version
        run: |
          version=$(dotnet msbuild src/Dp9ik/Dp9ik.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # The SMT invariant tests run the z3 solver.
      - name: Install z3
        run: sudo apt-get update && sudo apt-get install -y z3

      # Builds the drawterm-derived reference tool and runs the differential tests.
      - name: Test
        run: dotnet test tests/Dp9ik.Tests -c Release

      - name: Pack
        run: |
          for project in src/Dp9ik src/Dp9ik.P9Auth src/Dp9ik.Tls; do
            dotnet pack "$project" -c Release -o artifacts -p:ContinuousIntegrationBuild=true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: kiljoy001

      # Symbol packages (.snupkg) next to each .nupkg are pushed with it.
      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
